name: Build Minecraft Forge 1.8.9 mod

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 2.14.1
        shell: bash
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Build mod
        run: gradle --no-daemon setupDecompWorkspace build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AimAssistForge189-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
